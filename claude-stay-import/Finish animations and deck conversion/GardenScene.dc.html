<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes sway1 { 0%,100% { transform: rotate(-0.7deg); } 50% { transform: rotate(0.7deg); } }
@keyframes sway2 { 0%,100% { transform: rotate(0.5deg) translateX(-1px); } 50% { transform: rotate(-0.6deg) translateX(1px); } }
@keyframes sway3 { 0%,100% { transform: rotate(-1.1deg); } 50% { transform: rotate(1.1deg); } }
@keyframes blades { 0%,100% { transform: skewX(-1.4deg); } 50% { transform: skewX(1.8deg); } }
@keyframes drift { 0%,100% { transform: translateX(-2%); opacity: 0.46; } 50% { transform: translateX(3%); opacity: 0.74; } }
@keyframes ripple { 0%,100% { transform: scaleX(1) translateX(-0.6%); opacity: 0.3; } 50% { transform: scaleX(1.05) translateX(1%); opacity: 0.58; } }
@keyframes emberglow { 0%,100% { opacity: 0.3; } 50% { opacity: 0.66; } }
@keyframes sunshift { 0%,100% { opacity: 0.32; transform: translate3d(-1.5%,1%,0); } 50% { opacity: 0.6; transform: translate3d(1.5%,-1%,0); } }
@keyframes descend { from { opacity: 0; transform: scale(1.055); } to { opacity: 1; transform: none; } }
</style>
</helmet>
<div ref="{{ rootRef }}" aria-hidden="true" style="position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;background:#efe9dc">
  <sc-for list="{{ washes }}" as="w" hint-placeholder-count="3">
    <div data-depth="{{ w.depth }}" data-order="{{ w.order }}" style="{{ w.style }}"></div>
  </sc-for>
  <sc-for list="{{ planes }}" as="p" hint-placeholder-count="6">
    <div data-depth="{{ p.depth }}" data-order="{{ p.order }}" style="position:absolute;inset:0;will-change:transform;transition:opacity 0.9s ease">
      <div style="{{ p.anchor }}">
        <svg viewBox="{{ p.vb }}" preserveAspectRatio="none" style="width:100%;height:auto;display:block;overflow:visible">
          <sc-for list="{{ p.marks }}" as="m" hint-placeholder-count="8">
            <path d="{{ m.d }}" data-cue="{{ m.cue }}" style="{{ m.st }}"></path>
          </sc-for>
        </svg>
      </div>
    </div>
  </sc-for>
  <div ref="{{ openRef }}" style="position:absolute;inset:0;opacity:0;background:linear-gradient(180deg,rgba(255,253,246,0.9) 0%,rgba(253,249,239,0.62) 42%,rgba(250,245,233,0.22) 68%,rgba(248,243,230,0) 100%)"></div>
  <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
  <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 34%, rgba(255,252,244,0) 44%, rgba(58,64,48,0.11) 100%)"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:760},&quot;place&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;garden&quot;,&quot;person&quot;,&quot;builder&quot;,&quot;thinker&quot;,&quot;leader&quot;,&quot;stories&quot;,&quot;work&quot;,&quot;future&quot;,&quot;aura&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;garden&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Scene&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;still&quot;,&quot;trace&quot;,&quot;rare&quot;,&quot;occasional&quot;,&quot;steady&quot;],&quot;default&quot;:&quot;occasional&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Scene&quot;},&quot;reveal&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;scroll&quot;,&quot;thin&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Scene&quot;},&quot;signature&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;assemble&quot;,&quot;converge&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Scene&quot;}}">
const C = {
  far: '#9aa68b', far2: '#8b9880', far3: '#7d8b74',
  mid: '#61715a', mid2: '#54654f', mid3: '#485a45',
  near: '#3d4c3a', deep: '#2b3628',
  earth: '#b9ac95', earth2: '#a2957f',
  bark: '#6d5947', barkD: '#4c3f31', barkL: '#8a7460',
  stone: '#bdb6a5', stoneD: '#9b9483', stoneDD: '#7f7869',
  water: '#84968d', sakura: '#dcc0bf', sakuraD: '#c9a5a6', bloom: '#f0dcd8',
  gold: '#b0904f', ivory: '#efe9dc', ivoryW: '#fbf7ec', paper: '#e6dfcd'
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.rootRef = (el) => { this.root = el; };
    this.canvasRef = (el) => { this.canvas = el; };
    this.openRef = (el) => { this.open = el; };
    this.reduce = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.petals = []; this.ripples = [];
    this.pointer = { x: 0, y: 0 };
    this.introP = 0;
  }

  /* ---------- primitives: every drawable is one <path> + one style object ---------- */
  mk(d, o) {
    const st = { fill: 'none', stroke: 'none', opacity: 1, strokeLinecap: 'round', strokeLinejoin: 'round' };
    o = o || {};
    if (o.fill) st.fill = o.fill;
    if (o.stroke) { st.stroke = o.stroke; st.strokeWidth = (o.sw || 1) + 'px'; }
    if (o.o !== undefined) st.opacity = o.o;
    if (o.blur) st.filter = 'blur(' + o.blur + 'px)';
    if (o.anim && !this.reduce) { st.animation = o.anim; st.transformBox = 'fill-box'; st.transformOrigin = o.origin || '50% 100%'; }
    if (o.dash) st.strokeDasharray = o.dash;
    return { d: d, st: st, cue: o.cue };
  }
  /* stamp a build order onto a group of marks so the scene can assemble itself */
  cue(marks, from) {
    marks.forEach((m, i) => { m.cue = (from || 0) + i; });
    return marks;
  }
  sway(n, seed) { return 'sway' + n + ' ' + (12 + (seed % 7) * 1.6 + n * 3) + 's ease-in-out infinite'; }
  rnd(seed) { let s = ((seed * 9301 + 49297) % 233280 + 233280) % 233280; return function () { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
  n1(v) { return Math.round(v * 10) / 10; }

  /* silhouette generators (all coordinates in the plane's own viewBox units) */
  ridgeD(y, h, n, seed, floor) {
    const r = this.rnd(seed); let d = 'M -60 ' + floor + ' L -60 ' + this.n1(y);
    const step = 1120 / n; let x = -60;
    for (let i = 0; i < n; i++) {
      const nx = x + step;
      d += ' Q ' + this.n1(x + step * 0.5) + ' ' + this.n1(y - h * (0.3 + r() * 0.7)) + ' ' + this.n1(nx) + ' ' + this.n1(y - h * 0.14 * r());
      x = nx;
    }
    return d + ' L ' + this.n1(x) + ' ' + floor + ' Z';
  }
  crownD(cx, cy, rx, ry, lobes, seed) {
    const r = this.rnd(seed); const pts = [];
    for (let i = 0; i < lobes; i++) {
      const a = (i / lobes) * Math.PI * 2, rr = 0.7 + r() * 0.44;
      pts.push([cx + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr]);
    }
    let d = 'M ' + this.n1(pts[0][0]) + ' ' + this.n1(pts[0][1]);
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      d += ' Q ' + this.n1((mx - cx) * 1.2 + cx) + ' ' + this.n1((my - cy) * 1.2 + cy) + ' ' + this.n1(q[0]) + ' ' + this.n1(q[1]);
    }
    return d + ' Z';
  }
  trunkD(x, yb, yt, w, lean) {
    const l = lean || 0, H = yb - yt;
    return 'M ' + this.n1(x - w) + ' ' + this.n1(yb) +
      ' C ' + this.n1(x - w * 0.62) + ' ' + this.n1(yb - H * 0.5) + ' ' + this.n1(x + l - w * 0.3) + ' ' + this.n1(yb - H * 0.82) + ' ' + this.n1(x + l - w * 0.2) + ' ' + this.n1(yt) +
      ' L ' + this.n1(x + l + w * 0.2) + ' ' + this.n1(yt) +
      ' C ' + this.n1(x + l + w * 0.32) + ' ' + this.n1(yb - H * 0.82) + ' ' + this.n1(x + w * 0.66) + ' ' + this.n1(yb - H * 0.5) + ' ' + this.n1(x + w) + ' ' + this.n1(yb) + ' Z';
  }
  boughD(x, y, len, ang, curve) {
    const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
    const cx = x + Math.cos(ang - (curve || 0.4)) * len * 0.62, cy = y + Math.sin(ang - (curve || 0.4)) * len * 0.62;
    return 'M ' + this.n1(x) + ' ' + this.n1(y) + ' Q ' + this.n1(cx) + ' ' + this.n1(cy) + ' ' + this.n1(ex) + ' ' + this.n1(ey);
  }
  bladesD(x0, x1, y, h, n, seed) {
    const r = this.rnd(seed); let d = '';
    for (let i = 0; i < n; i++) {
      const x = x0 + (x1 - x0) * (i / (n - 1)) + (r() - 0.5) * 8;
      const hh = h * (0.5 + r() * 0.75), bend = (r() - 0.5) * h * 0.85;
      d += 'M ' + this.n1(x) + ' ' + this.n1(y) + ' Q ' + this.n1(x + bend * 0.35) + ' ' + this.n1(y - hh * 0.6) + ' ' + this.n1(x + bend) + ' ' + this.n1(y - hh) + ' ';
    }
    return d;
  }
  stoneD(cx, cy, w, h, seed) {
    const r = this.rnd(seed); const n = 8; let d = 'M ' + this.n1(cx - w * 0.5) + ' ' + this.n1(cy);
    for (let i = 0; i <= n; i++) {
      const a = Math.PI - (i / n) * Math.PI, rr = 0.8 + r() * 0.34;
      d += ' L ' + this.n1(cx + Math.cos(a) * w * 0.5) + ' ' + this.n1(cy - Math.sin(a) * h * rr);
    }
    return d + ' L ' + this.n1(cx + w * 0.5) + ' ' + this.n1(cy) + ' Z';
  }
  dotD(x, y, r) { return 'M ' + this.n1(x - r) + ' ' + this.n1(y) + ' a ' + r + ' ' + r + ' 0 1 0 ' + (r * 2) + ' 0 a ' + r + ' ' + r + ' 0 1 0 ' + (-r * 2) + ' 0 Z'; }
  boxD(x, y, w, h) { return 'M ' + this.n1(x) + ' ' + this.n1(y) + ' L ' + this.n1(x + w) + ' ' + this.n1(y) + ' L ' + this.n1(x + w) + ' ' + this.n1(y + h) + ' L ' + this.n1(x) + ' ' + this.n1(y + h) + ' Z'; }
  eaveD(cx, y, w, h) {
    const l = cx - w / 2, r = cx + w / 2;
    return 'M ' + this.n1(l) + ' ' + this.n1(y) +
      ' C ' + this.n1(cx - w * 0.33) + ' ' + this.n1(y - h * 0.16) + ' ' + this.n1(cx - w * 0.15) + ' ' + this.n1(y - h * 0.88) + ' ' + this.n1(cx) + ' ' + this.n1(y - h) +
      ' C ' + this.n1(cx + w * 0.15) + ' ' + this.n1(y - h * 0.88) + ' ' + this.n1(cx + w * 0.33) + ' ' + this.n1(y - h * 0.16) + ' ' + this.n1(r) + ' ' + this.n1(y) +
      ' C ' + this.n1(r - w * 0.02) + ' ' + this.n1(y + h * 0.22) + ' ' + this.n1(r - w * 0.06) + ' ' + this.n1(y + h * 0.14) + ' ' + this.n1(r - w * 0.11) + ' ' + this.n1(y + h * 0.1) +
      ' L ' + this.n1(l + w * 0.11) + ' ' + this.n1(y + h * 0.1) +
      ' C ' + this.n1(l + w * 0.06) + ' ' + this.n1(y + h * 0.14) + ' ' + this.n1(l + w * 0.02) + ' ' + this.n1(y + h * 0.22) + ' ' + this.n1(l) + ' ' + this.n1(y) + ' Z';
  }
  ribbonD(xt, wt, yt, xb, wb, yb) {
    const h = yb - yt;
    return 'M ' + this.n1(xt - wt / 2) + ' ' + this.n1(yt) + ' L ' + this.n1(xt + wt / 2) + ' ' + this.n1(yt) +
      ' C ' + this.n1(xt + wt * 0.5 + (xb + wb / 2 - xt - wt / 2) * 0.22) + ' ' + this.n1(yt + h * 0.42) + ' ' + this.n1(xb + wb * 0.42) + ' ' + this.n1(yt + h * 0.76) + ' ' + this.n1(xb + wb / 2) + ' ' + this.n1(yb) +
      ' L ' + this.n1(xb - wb / 2) + ' ' + this.n1(yb) +
      ' C ' + this.n1(xb - wb * 0.42) + ' ' + this.n1(yt + h * 0.76) + ' ' + this.n1(xt - wt * 0.5 - (xt - wt / 2 - xb + wb / 2) * 0.22) + ' ' + this.n1(yt + h * 0.42) + ' ' + this.n1(xt - wt / 2) + ' ' + this.n1(yt) + ' Z';
  }

  /* ---------- composite objects ---------- */
  tree(x, gy, s, seed, col, o) {
    const r = this.rnd(seed), out = [], th = s * 0.92, lean = (r() - 0.5) * s * 0.1;
    out.push(this.mk(this.trunkD(x, gy, gy - th, s * 0.062, lean), { fill: C.bark, o: (o || 1) * 0.92 }));
    for (let i = 0; i < 3; i++) out.push(this.mk(this.boughD(x + lean * 0.6, gy - th * 0.7, s * 0.3, -Math.PI / 2 + (i - 1) * 0.75, 0.5), { stroke: C.bark, sw: s * 0.024, o: (o || 1) * 0.7 }));
    out.push(this.mk(this.crownD(x + lean, gy - th - s * 0.22, s * 0.56, s * 0.4, 11, seed + 3), { fill: col, o: (o || 1) * 0.94, anim: this.sway(1, seed) }));
    out.push(this.mk(this.crownD(x + lean - s * 0.3, gy - th + s * 0.02, s * 0.36, s * 0.26, 9, seed + 7), { fill: col, o: (o || 1) * 0.82, anim: this.sway(2, seed + 1) }));
    out.push(this.mk(this.crownD(x + lean + s * 0.31, gy - th + s * 0.05, s * 0.34, s * 0.24, 9, seed + 11), { fill: col, o: (o || 1) * 0.78, anim: this.sway(2, seed + 2) }));
    return out;
  }
  sakura(x, gy, s, seed, o) {
    const r = this.rnd(seed), out = [], th = s * 0.78, lean = (r() - 0.5) * s * 0.16;
    out.push(this.mk(this.trunkD(x, gy, gy - th, s * 0.058, lean), { fill: C.barkD, o: (o || 1) * 0.9 }));
    const bx = x + lean, by = gy - th;
    const angs = [-2.5, -1.95, -1.35, -0.8];
    angs.forEach((a, i) => {
      out.push(this.mk(this.boughD(bx, by + s * 0.06, s * (0.36 + (i % 2) * 0.1), a, 0.55), { stroke: C.barkD, sw: s * 0.026, o: (o || 1) * 0.78 }));
    });
    const puffs = [[bx, by - s * 0.2, 0.5, 0.3], [bx - s * 0.38, by - s * 0.06, 0.34, 0.22], [bx + s * 0.4, by - s * 0.1, 0.36, 0.23], [bx - s * 0.14, by - s * 0.36, 0.3, 0.19], [bx + s * 0.18, by - s * 0.38, 0.28, 0.18]];
    puffs.forEach((p, i) => {
      out.push(this.mk(this.crownD(p[0], p[1], s * p[2], s * p[3], 10, seed + i * 5), { fill: i % 2 ? C.sakuraD : C.sakura, o: (o || 1) * (0.9 - i * 0.06), anim: this.sway(i % 2 ? 2 : 1, seed + i) }));
    });
    let flecks = '';
    for (let i = 0; i < 14; i++) flecks += this.dotD(bx + (r() - 0.5) * s * 1.1, by - s * 0.34 + (r() - 0.4) * s * 0.5, s * 0.016) + ' ';
    out.push(this.mk(flecks, { fill: C.bloom, o: (o || 1) * 0.7 }));
    return out;
  }
  bush(x, gy, w, h, seed, col, o) {
    const out = [];
    out.push(this.mk(this.crownD(x, gy - h * 0.55, w * 0.5, h * 0.55, 9, seed), { fill: col, o: o === undefined ? 0.9 : o, anim: this.sway(3, seed) }));
    out.push(this.mk(this.crownD(x - w * 0.3, gy - h * 0.34, w * 0.3, h * 0.36, 8, seed + 4), { fill: col, o: (o === undefined ? 0.9 : o) * 0.86 }));
    out.push(this.mk(this.crownD(x + w * 0.32, gy - h * 0.3, w * 0.28, h * 0.32, 8, seed + 9), { fill: col, o: (o === undefined ? 0.9 : o) * 0.82 }));
    return out;
  }
  lantern(x, gy, s, o) {
    const out = [], op = o === undefined ? 0.9 : o;
    out.push(this.mk(this.stoneD(x, gy, s * 0.62, s * 0.14, 5), { fill: C.stoneDD, o: op }));
    out.push(this.mk(this.boxD(x - s * 0.09, gy - s * 0.52, s * 0.18, s * 0.42), { fill: C.stoneD, o: op }));
    out.push(this.mk(this.boxD(x - s * 0.24, gy - s * 0.6, s * 0.48, s * 0.09), { fill: C.stoneDD, o: op }));
    out.push(this.mk(this.boxD(x - s * 0.19, gy - s * 0.9, s * 0.38, s * 0.3), { fill: C.stone, o: op }));
    out.push(this.mk(this.dotD(x, gy - s * 0.75, s * 0.1), { fill: C.gold, o: 0.5, blur: 1.4, anim: 'emberglow 7s ease-in-out infinite', origin: '50% 50%' }));
    out.push(this.mk(this.eaveD(x, gy - s * 0.9, s * 0.62, s * 0.22), { fill: C.stoneDD, o: op }));
    out.push(this.mk(this.dotD(x, gy - s * 1.16, s * 0.045), { fill: C.stoneD, o: op }));
    return out;
  }
  teaHouse(x, gy, s, o) {
    const out = [], op = o === undefined ? 1 : o;
    out.push(this.mk(this.boxD(x - s * 0.5, gy - s * 0.08, s, s * 0.08), { fill: C.stoneDD, o: op * 0.8 }));
    out.push(this.mk(this.boxD(x - s * 0.44, gy - s * 0.46, s * 0.88, s * 0.38), { fill: C.paper, o: op * 0.82 }));
    [0.22, 0.5, 0.78].forEach((f) => out.push(this.mk(this.boxD(x - s * 0.44 + s * 0.88 * f, gy - s * 0.46, s * 0.012, s * 0.38), { fill: C.barkD, o: op * 0.5 })));
    out.push(this.mk(this.boxD(x - s * 0.44, gy - s * 0.28, s * 0.88, s * 0.012), { fill: C.barkD, o: op * 0.45 }));
    out.push(this.mk(this.boxD(x - s * 0.46, gy - s * 0.5, s * 0.03, s * 0.44), { fill: C.barkD, o: op * 0.85 }));
    out.push(this.mk(this.boxD(x + s * 0.43, gy - s * 0.5, s * 0.03, s * 0.44), { fill: C.barkD, o: op * 0.85 }));
    out.push(this.mk(this.eaveD(x, gy - s * 0.48, s * 1.34, s * 0.34), { fill: C.barkD, o: op * 0.92 }));
    out.push(this.mk(this.eaveD(x, gy - s * 0.5, s * 1.2, s * 0.26), { fill: C.bark, o: op * 0.5 }));
    return out;
  }
  pavilion(x, gy, s, o) {
    const out = [], op = o === undefined ? 1 : o, top = gy - s * 0.86;
    for (let i = 0; i < 5; i++) {
      const px = x - s * 0.5 + s * 0.25 * i;
      out.push(this.mk(this.boxD(px - s * 0.018, top, s * 0.036, s * 0.86), { fill: i % 2 ? C.bark : C.barkD, o: op * (0.9 - i * 0.04) }));
    }
    out.push(this.mk(this.boxD(x - s * 0.54, top - s * 0.03, s * 1.08, s * 0.038), { fill: C.barkD, o: op * 0.95 }));
    out.push(this.mk(this.boxD(x - s * 0.5, gy - s * 0.4, s, s * 0.022), { fill: C.bark, o: op * 0.6 }));
    for (let i = 0; i < 6; i++) {
      const rx = x - s * 0.46 + s * 0.185 * i;
      out.push(this.mk('M ' + this.n1(rx) + ' ' + this.n1(top - s * 0.03) + ' L ' + this.n1(rx + s * 0.1) + ' ' + this.n1(top - s * 0.22), { stroke: C.bark, sw: s * 0.016, o: op * 0.62 }));
      out.push(this.mk('M ' + this.n1(rx + s * 0.1) + ' ' + this.n1(top - s * 0.22) + ' L ' + this.n1(rx + s * 0.2) + ' ' + this.n1(top - s * 0.03), { stroke: C.bark, sw: s * 0.016, o: op * 0.5 }));
    }
    out.push(this.mk('M ' + this.n1(x - s * 0.56) + ' ' + this.n1(top - s * 0.04) + ' L ' + this.n1(x) + ' ' + this.n1(top - s * 0.26) + ' L ' + this.n1(x + s * 0.56) + ' ' + this.n1(top - s * 0.04), { stroke: C.barkD, sw: s * 0.02, o: op * 0.7 }));
    out.push(this.mk(this.boxD(x - s * 0.58, gy - s * 0.02, s * 1.16, s * 0.03), { fill: C.stoneDD, o: op * 0.7 }));
    return out;
  }
  torii(x, gy, s, o) {
    const out = [], op = o === undefined ? 1 : o, top = gy - s;

      for (let i = 0; i < sc.P.length; i++) if (sc.P[i].depth >= 0.4) { at = i; break; }
      sc.P.splice(at, 0, this.turf(place.length * 31 + 5, place === 'stories'));
    }
    return { washes: sc.W, planes: sc.P, rootRef: this.rootRef, canvasRef: this.canvasRef, openRef: this.openRef };
  }

  /* ---------- atmosphere: parallax, arrival assembly, petals, ripples ---------- */
  collect() {
    this.layers = this.root ? Array.prototype.slice.call(this.root.querySelectorAll('[data-depth]')) : [];
    if (this.revealing) {
      this.layers.forEach((el) => {
        const o = parseFloat(el.getAttribute('data-order'));
        if (o >= 0 && !el.style.opacity) el.style.opacity = '0';
      });
    }
  }

  componentDidMount() {
    const mode = this.props.reveal || 'none';
    this.revealing = mode === 'scroll' && !this.reduce;
    this.thinning = mode === 'thin' && !this.reduce;
    this.collect();
    this.onScroll = () => {
      if (this.frame) return;
      this.frame = window.requestAnimationFrame(() => { this.frame = 0; this.apply(); });
    };
    this.onPointer = (e) => {
      this.pointer.x = (e.clientX / Math.max(1, window.innerWidth) - 0.5) * 2;
      this.pointer.y = (e.clientY / Math.max(1, window.innerHeight) - 0.5) * 2;
      this.onScroll();
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onScroll);
    document.addEventListener('scroll', this.onScroll, { passive: true, capture: true });
    if (!this.reduce) window.addEventListener('pointermove', this.onPointer, { passive: true });
    window.requestAnimationFrame(() => { this.collect(); this.apply(); if (this.revealing) this.runIntro(); });
    this.apply();
    this.startAtmosphere();
    this.descend();
    this.armSignature();
  }

  /* SIGNATURE 5 (builder) and 6 (leader) — the built things put themselves together */
  armSignature() {
    const sig = this.props.signature || 'none';
    if (sig === 'none' || this.reduce || !this.root) return;
    const cued = Array.prototype.slice.call(this.root.querySelectorAll('[data-cue]'))
      .filter((el) => el.getAttribute('data-cue') !== '');
    if (!cued.length) return;
    cued.sort((a, b) => parseFloat(a.getAttribute('data-cue')) - parseFloat(b.getAttribute('data-cue')));
    const converge = sig === 'converge';
    cued.forEach((el) => {
      el.setAttribute('data-o', el.style.opacity || '1');
      el.style.opacity = '0';
      el.style.transformBox = 'fill-box';
      el.style.transformOrigin = converge ? '50% 0%' : '50% 100%';
      el.style.transform = converge ? 'scaleX(0.12)' : 'translateY(14px)';
      el.style.transition = 'opacity 820ms ease, transform 1000ms cubic-bezier(0.2,0.7,0.2,1)';
    });
    const fire = () => {
      cued.forEach((el, i) => {
        window.setTimeout(() => {
          el.style.opacity = el.getAttribute('data-o') || '1';
          el.style.transform = 'none';
        }, i * (converge ? 320 : 130));
      });
    };
    const watch = () => {
      if ((window.scrollY || 0) > window.innerHeight * 0.3) { fire(); window.removeEventListener('scroll', watch); }
    };
    window.addEventListener('scroll', watch, { passive: true });
    window.setTimeout(() => { if (!this.fired) { this.fired = true; fire(); } }, 2600);
  }

  /* the camera settles into the place you arrived at */
  descend() {
    if (this.reduce || !this.root) return;
    /* a CSS animation, not rAF: a page that loads hidden still ends up visible */
    this.root.style.animation = 'descend 1200ms cubic-bezier(0.18,0.72,0.14,1) both';
  }

  componentDidUpdate() {
    if (!this.layers || this.layers.length === 0) { this.collect(); this.apply(); }
  }

  runIntro() {
    const dur = 2600, t0 = window.performance.now();
    const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
    const step = (now) => {
      const t = Math.min(1, (now - t0) / dur);
      this.introP = 0.66 * ease(t);
      this.apply();
      if (t < 1) this.introRaf = window.requestAnimationFrame(step);
    };
    this.introRaf = window.requestAnimationFrame(step);
  }

  apply() {
    if (!this.layers || this.layers.length === 0) this.collect();
    const y = window.scrollY || window.pageYOffset || (document.documentElement && document.documentElement.scrollTop) || 0;
    const vh = Math.max(1, window.innerHeight);
    const p = Math.max(Math.min(1.4, y / (vh * 0.8)), this.introP || 0);
    const t = this.reduce ? 0 : window.performance.now();
    this.layers.forEach((el) => {
      const d = parseFloat(el.getAttribute('data-depth')) || 0;
      let dx = 0;
      if (!this.reduce) dx = this.pointer.x * -8 * d + Math.sin(t / 11000 + d * 3) * 5 * d;
      const dy = this.reduce ? 0 : -y * d * 0.2 + (this.reduce ? 0 : Math.cos(t / 15000 + d * 2) * 2 * d);
      el.style.transform = 'translate3d(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px,0)';
      if (this.revealing) {
        const o = parseFloat(el.getAttribute('data-order'));
        if (o >= 0) el.style.opacity = Math.min(1, Math.max(0, (p - o * 0.72) / 0.34)).toFixed(3);
      } else if (this.thinning) {
        /* SIGNATURE 9 — the near garden thins out first, the distance holds longest */
        const o = parseFloat(el.getAttribute('data-order'));
        if (o >= 0.2) {
          const start = 0.12 + (0.72 - Math.min(0.72, o)) * 1.15;
          el.style.opacity = Math.min(1, Math.max(0, 1 - (p - start) / 0.5)).toFixed(3);
        }
      }
    });
    if (this.thinning && this.open) this.open.style.opacity = Math.min(0.85, Math.max(0, (p - 0.25) / 0.7)).toFixed(3);
  }

  startAtmosphere() {
    const cv = this.canvas;
    if (!cv) return;
    const density = this.props.density || 'occasional';
    /* per-destination ambient intensity: the world is alive, but not equally everywhere */

      : density === 'trace' ? 3
      : density === 'rare' ? 7
      : density === 'steady' ? 24
      : 14;
    const ctx = cv.getContext('2d');
    const size = () => {
      const r = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.max(1, Math.round(window.innerWidth * r));
      cv.height = Math.max(1, Math.round(window.innerHeight * r));
      ctx.setTransform(r, 0, 0, r, 0, 0);
    };
    size();
    this.onResizeCv = size;
    window.addEventListener('resize', this.onResizeCv);
    if (!count) return;

    const W = () => window.innerWidth, H = () => window.innerHeight;
    this.petals = [];
    for (let i = 0; i < count; i++) {
      this.petals.push({
        x: Math.random() * W(), y: Math.random() * H(),
        z: 0.35 + Math.random() * 0.9, r: 3 + Math.random() * 4,
        vy: 0.16 + Math.random() * 0.4, ph: Math.random() * 6.283, sp: 0.004 + Math.random() * 0.01,
        rot: Math.random() * 6.283, vr: (Math.random() - 0.5) * 0.012, tone: tones[i % tones.length]

      if (document.hidden) { last = now; return; }

      if ((tick++ % 5) === 0) this.apply();
      ctx.clearRect(0, 0, W(), H());
      const wl = this.waterY ? this.waterY * H() : null;
      for (const q of this.petals) {
        q.ph += q.sp * dt; q.rot += q.vr * dt * 0.06;
        q.y += q.vy * q.z * dt * 0.06;
        q.x += Math.sin(q.ph) * 0.5 * q.z;
        if (wl && q.y > wl + (1 - q.z) * 40) {
          if (this.ripples.length < 8) this.ripples.push({ x: q.x, y: q.y, r: 2, a: 0.5, z: q.z });
          q.y = -20; q.x = Math.random() * W();
        }
        if (q.y > H() + 20) { q.y = -20; q.x = Math.random() * W(); }
        if (q.x > W() + 20) q.x = -20;
        if (q.x < -20) q.x = W() + 20;
        ctx.save();
        ctx.translate(q.x, q.y); ctx.rotate(q.rot);
        ctx.globalAlpha = 0.35 + q.z * 0.45;
        ctx.fillStyle = q.tone;
        ctx.beginPath();
        ctx.ellipse(0, 0, q.r * q.z, q.r * q.z * 0.55, 0, 0, 6.283);
        ctx.fill();
        ctx.restore();
      }
      for (let i = this.ripples.length - 1; i >= 0; i--) {
        const rp = this.ripples[i];
        rp.r += dt * 0.026 * rp.z; rp.a -= dt * 0.00042;
        if (rp.a <= 0) { this.ripples.splice(i, 1); continue; }
        ctx.save();
        ctx.strokeStyle = 'rgba(251,247,236,' + rp.a.toFixed(3) + ')';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.ellipse(rp.x, rp.y, rp.r * 2.4, rp.r * 0.66, 0, 0, 6.283);
        ctx.stroke();
        ctx.restore();
      }
    };
    this.raf = window.requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onScroll);
    document.removeEventListener('scroll', this.onScroll, true);
    if (this.onResizeCv) window.removeEventListener('resize', this.onResizeCv);
    if (this.onPointer) window.removeEventListener('pointermove', this.onPointer);
    if (this.raf) window.cancelAnimationFrame(this.raf);
    if (this.frame) window.cancelAnimationFrame(this.frame);
    if (this.introRaf) window.cancelAnimationFrame(this.introRaf);
  }
}

</script>
